        - benefit_id: ben_04
          kind: free-service
          service: Advance Support add-on
          description: Free access to the Advance Support add-on, worth $1,200 a year.
        - benefit_id: ben_05
          kind: other
          description: Community access, mentorship, and a startup toolkit.
