          kind: credit
          value:
            kind: up-to
            amount:
              currency: USD
              minor_units: 1500000
          description: Up to $15,000 in Cloudways platform credits.
        - benefit_id: ben_02
          kind: discount
          percentage:
            kind: exact
            basis_points: 1500
          applies_to: Monthly Cloudways invoice
          description: 15% off the monthly Cloudways invoice.
        - benefit_id: ben_03
