offers:
  - offer_id: off_01m34t111njfjt86c64rmz2386
    program_id: prg_01m34t111ncrwb6c556fq4j12a
    offer_slug: start-level-cloud-credits
    offer_slug_aliases: []
    title: Start level cloud credits
    summary: Selected pre-seed and seed startups can receive €10,000 in free cloud credits and 6 hours of engineer consultation for 12 months.
    description: >-
      The Start level offers €10,000 of free credits for OVHcloud public cloud and hosted private cloud,
      plus 6 hours of 1-on-1 consultation with an engineer, for 12 months.
      Startup Program vouchers do not pay for Bare Metal Cloud or Web Cloud products.
      For GPU instances, only V100, V100S, and RTX5000 are eligible.
      The program is free: OVHcloud does not take shares and does not ask participants to repay vouchers they use or do not use.
      Participation lasts a maximum of 12 months from contract signature. Remaining vouchers are then invalid.
      Credits are activated within 48 business hours after the contract is signed.
    lifecycle:
      status: active
      effective_from: 2026-09-22T15:00:00.000Z
    economics:
      consideration:
        kind: none
      benefits:
        - benefit_id: ben_01
          description: €10,000 of free credits for public cloud and hosted private cloud. Bare Metal Cloud and Web Cloud are not covered. GPU instances are limited to V100, V100S, and RTX5000.
          kind: credit
          value:
            amount:
              currency: EUR
              minor_units: 1000000
            kind: exact
          duration:
            kind: exact
            value: P12M
        - benefit_id: ben_02
          description: 6 hours of free 1-on-1 consultation with an OVHcloud engineer during the 12-month Start level.
          kind: free-service
          service: OVHcloud engineer consultation
          duration:
            kind: exact
            value: P12M
    eligibility:
      rule:
        kind: all
        rules:
          - criterion_id: cri_01
            kind: manual
            reason: vendor-discretion
            statement: Applicant is a selected pre-seed or seed startup.
          - criterion_id: cri_02
            kind: manual
            reason: external-verification
            statement: Applicant proposes an innovative technical project with growth potential and at least a proof of concept or minimum viable product that can be implemented on OVHcloud.
          - criterion_id: cri_03
            kind: manual
            reason: external-verification
            statement: The project is a professional startup or activity. Projects that are not linked to a professional startup or activity, including NGOs and associations, are not supported.
          - criterion_id: cri_04
            kind: manual
            reason: external-verification
            statement: The company has not already signed up for or taken part in an OVHcloud Startup Program, previously called Digital Launch Pad.
          - criterion_id: cri_05
            kind: manual
            reason: vendor-discretion
            statement: A selection committee reviews the application and may decline it. OVHcloud sends a response within 7 days.
          - criterion_id: cri_06
            kind: manual
            reason: external-verification
            statement: The startup needs cloud infrastructure soon, because allocated vouchers must be used within the program time limit or they are lost.
    roles:
