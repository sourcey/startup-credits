    access:
      availability: public
      method: form
      url: https://startup.ovhcloud.com/en/startups/
      instructions: Apply on the Start level page with the OVHcloud customer account that should receive the vouchers, or create an account in the application. After acceptance, sign the Startup Program contract. Credits activate within 48 business hours after signature and remain valid for 12 months from that date. Keep a valid payment method on the account for products the credits do not cover and for service continuity after the credits expire.
