    offer_slug_aliases: []
    title: Grok for Startups credits
    summary: Venture-backed startups with a live product get promotional credits for Grok, Grok Build, Grok Bot and the Grok API from one balance, sized to their goals; 20% on approval and 80% once up and running.
    lifecycle:
      status: active
      effective_from: 2026-10-22T00:00:00.000Z
    economics:
      consideration:
        kind: none
      benefits:
        - benefit_id: ben_credits
          description: Promotional credits for Grok, Grok Build, Grok Bot and the Grok API from one balance, sized to the startup's goals; SpaceXSI aims to offer six to twelve months of real usage. 20% of the credits are released on approval and the other 80% once the startup is up and running; credits expire six months after they are applied.
          kind: other
        - benefit_id: ben_onboarding
          description: Hands-on onboarding and a direct line to the SpaceXSI startups team.
          kind: other
    eligibility:
      rule:
        kind: all
        rules:
          - kind: manual
            criterion_id: cri_01
            statement: SpaceXSI considers funding, investors, revenue, current AI spend, traction, team size, intended use, program capacity and verification results when evaluating an application, and determines eligibility in its sole discretion.
            reason: vendor-discretion
          - kind: manual
            criterion_id: cri_02
            statement: The work email must be on the same domain as the company website.
            reason: not-machine-evaluable
          - kind: manual
            criterion_id: cri_03
            statement: Only one grant of credits is available per Company Group.
            reason: not-machine-evaluable
          - kind: manual
            criterion_id: cri_04
            statement: Employees, contractors, agents and representatives (and their immediate families) of SpaceXSI, Anysphere, Inc., Space Exploration Technologies, Corp., Tesla, Inc., X Corp., or their parents, subsidiaries and divisions are not eligible.
            reason: not-machine-evaluable
          - kind: manual
            criterion_id: cri_05
            statement: The applicant's Company Group, and any director, officer, employee, agent or other person acting on its behalf, must not be identified on any applicable economic sanctions or export control lists, or be organized, resident or located in, or an agency or instrumentality of the government of, any country or territory that is the target of comprehensive U.S. sanctions or embargoes.
            reason: not-machine-evaluable
