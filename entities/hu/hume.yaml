      rule:
        kind: all
        rules:
          - kind: predicate
            criterion_id: cri_employees
            statement: Fewer than 25 employees at the time of application
            fact: company.employee_count
            operator: lt
            value:
              type: number
              value: 25
          - kind: manual
            criterion_id: cri_sanctions
            statement: Applicants must not be located in, organized under the laws of, or ordinarily resident in any country or territory subject to U.S. export controls or sanctions.
            reason: not-machine-evaluable
          - kind: manual
            criterion_id: cri_one_enrollment
            statement: Limit one Program enrollment per Recipient; prior Hume AI Startup Program recipients, including their subsidiaries or affiliates, are ineligible.
            reason: not-machine-evaluable
          - kind: manual
            criterion_id: cri_accurate_info
            statement: Applicants must provide complete and accurate information regarding their intended use of Hume AI's services.
            reason: not-machine-evaluable
          - kind: manual
            criterion_id: cri_application_window
            statement: Applications are accepted on a rolling basis while the Program is active, for six months, subject to extension or early closure at Hume AI's sole discretion.
