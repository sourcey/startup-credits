    title: Three to six months of finance services at no cost
    summary: Eligible startups and small businesses receive scoped bookkeeping, CFO guidance, financial reporting, and finance-system support at no cost for three to six months.
    description: Usually three months, extendable to six. Businesses may leave afterward or choose paid bookkeeping. In-depth advisory projects outside the published program scope are priced separately.
    lifecycle:
      status: active
      effective_from: 2026-10-07T20:24:03.747Z
