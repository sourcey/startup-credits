      benefits:
        - benefit_id: ben_01
          kind: free-service
          service: Scoped bookkeeping, CFO advisory, investor reporting, forecasts, budgets, tools, and finance-system setup.
          description: Included Finance Accelerator services at no cost; normally completed in three months, with up to six months depending on circumstances.
          duration:
            kind: up-to
            value: P6M
      consideration:
        kind: none
    eligibility:
      rule:
        kind: all
        rules:
          - criterion_id: cri_01
            kind: manual
            reason: external-verification
            statement: A startup or small business operating through a US legal entity with a US bank account; European companies may participate through their US entity.
          - criterion_id: cri_02
            kind: manual
            reason: external-verification
            statement: The business must have a full-time team, including full-time founders dedicated to the company.
          - criterion_id: cri_03
            kind: manual
            reason: external-verification
            statement: Revenue of approximately USD 100,000 in the last 12 months or USD 10,000 per month, with flexibility for fluctuations; pre-revenue applicants must have raised at least USD 250,000 from investors.
          - criterion_id: cri_04
            kind: manual
            reason: vendor-discretion
            statement: Founders must demonstrate a desire to grow and scale the business during an eligibility interview.
