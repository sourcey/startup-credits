        kind: none
      benefits:
        - benefit_id: ben_startup_credits
          description: $1,000 in fal platform credits on approval, growing to $5,000 total as monthly fal spend crosses $1,000 and $2,500 thresholds, plus bundled partner perks.
          kind: credit
          value:
            kind: range
            minimum:
              currency: USD
              minor_units: 100000
            maximum:
              currency: USD
              minor_units: 500000
    eligibility:
      rule:
