    offer_slug_aliases: []
    title: $1,000 in credits, growing to $5,000 with usage
    summary: Approved startups receive $1,000 in fal platform credits, growing to $2,500 at $1,000 per month of fal spend and $5,000 at $2,500 per month, plus bundled partner perks.
    description: Every approved team starts with the $1,000 Startup pack. Once monthly spend on fal crosses $1,000, fal adds $1,500 more on request (Scale pack); at $2,500 per month of fal spend, fal adds another $2,500 (Growth pack), for a $5,000 total. Teams already at a threshold when they apply can start at the matching pack. Partner perks from fal's partners come bundled with acceptance.
