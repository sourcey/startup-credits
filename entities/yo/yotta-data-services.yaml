    offer_slug: rudra-launch-tier
    offer_slug_aliases: []
    title: Rudra Launch Tier
    summary: Startups admitted at Rudra's Launch stage (under 1 year old, under $50K revenue or funding) receive $10,000 in Yotta cloud credits in two tranches, valid for 6 months, plus 25% off additional usage.
    lifecycle:
      status: active
      effective_from: 2026-08-21T18:40:42.000Z
    economics:
      benefits:
        - benefit_id: ben_01
          description: Launch stage total credit of $10,000, issued in tranches of $1,000 and $9,000 and valid for 6 months from entry into the stage.
          duration:
            kind: exact
            value: P6M
          kind: credit
          value:
            amount:
              currency: USD
              minor_units: 1000000
            kind: up-to
        - benefit_id: ben_02
          description: 25% discount on additional usage, including after program exit.
          kind: discount
          percentage:
            basis_points: 2500
            kind: exact
      consideration:
        kind: none
    eligibility:
      rule:
        kind: all
        rules:
          - criterion_id: cri_01
            kind: manual
            reason: external-verification
            statement: The startup works on innovative projects in AI or ML, data science, or high-performance computing.
          - criterion_id: cri_02
            kind: manual
            reason: external-verification
            statement: The startup has an active company website and LinkedIn profiles for the applicant and the company.
          - criterion_id: cri_03
            kind: manual
            reason: external-verification
            statement: The startup is bootstrapped or funded up to and including Pre-Seed, Angel, Seed, Debt Financing, and Series A stages.
          - criterion_id: cri_04
            kind: manual
            reason: external-verification
            statement: The startup has not previously received credits of eligible or greater value from Yotta under any other program.
          - criterion_id: cri_05
            kind: manual
            reason: external-verification
            statement: For the Launch stage, the company is less than 1 year old, at the concept stage, and has annual revenue or funding below $50K.
