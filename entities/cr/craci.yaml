profile:
  summary: CRACI runs hosted CI runners that record a build-time software bill of materials and gate builds on vulnerability policy.
  description: CRACI provides hosted GitHub Actions style CI runners that record every package downloaded during a build, produce a build-time SBOM, match known CVEs and can stop a build before a vulnerable artifact ships.
