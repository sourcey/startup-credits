    program_id: prg_01m11nxtqypjcptx65e7k4jbcb
    offer_slug: startup-cloud-credits
    offer_slug_aliases: []
    title: $100 to $5,000+ in Distribute startup credits
    summary: Approved pre-seed and seed teams building in or for the EU receive free Distribute credits from $100 to $5,000 or more, scaled by stage, for apps, databases, and AI Studio.
    lifecycle:
      status: active
      effective_from: 2026-08-27T13:17:00.000Z
    economics:
      benefits:
        - benefit_id: ben_01
          description: Distribute credits from $100 to $5,000 or more, scaled by stage ($100+ for an idea or prototype, $500 for MVP runway, $1,000+ for a scaling team), usable across the whole platform
          kind: credit
          value:
            kind: at-least
            amount:
              currency: USD
              minor_units: 10000
        - benefit_id: ben_02
          description: Fast-track onboarding and direct access to the Distribute team
          kind: other
      consideration:
        kind: none
    eligibility:
      rule:
        kind: all
        rules:
          - criterion_id: cri_01
            kind: manual
            reason: external-verification
            statement: The company is at pre-seed or seed stage, under 24 months old, and raising or pre-revenue; independent founders are welcome.
          - criterion_id: cri_02
            kind: manual
            reason: external-verification
            statement: The company is building in the EU, or plans to serve EU customers and needs sovereignty-compliant infrastructure.
          - criterion_id: cri_03
            kind: manual
            reason: external-verification
            statement: The company has a working product past the prototype stage or is actively shipping to early users.
          - criterion_id: cri_04
            kind: manual
            reason: vendor-discretion
            statement: Distribute reads every application and replies by email with a decision.
