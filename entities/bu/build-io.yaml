profile:
  summary: Build.io is a cloud application platform for deploying and running apps with managed add-ons.
  description: Build.io deploys apps with Cloud Native and Heroku buildpacks, provisions managed add-ons like Postgres and Redis, migrates from Heroku, Render or AWS, and keeps data in the US, EU or Japan.
  links:
    site: https://build.io
