    program_slug_aliases: []
    title: HKUST x HKSTP Co-ideation Program
    summary: Joint HKUST and HKSTP programme that supports early-stage ventures with seed funding, coaching, training, and a pathway toward HKSTP incubation.
    source_ids:
      - src_75c577218f3db6445bdc64efc7628145b953bd80b4beefe0070e9770b8b777be
offers:
  - offer_id: off_01m2hb2fzaxkaxc5m32c4p4e7c
    program_id: prg_01m2hb2fza7b2z14h981gj64r6
    offer_slug: co-ideation-startup-grant
    offer_slug_aliases: []
    title: HKUST x HKSTP Co-ideation startup grant
    summary: Eligible early-stage ventures with an HKUST member can apply for up to HKD 100,000 in grant support plus coaching and training through a six-month co-ideation programme.
    lifecycle:
      status: active
      effective_from: 2026-09-15T01:32:11.000Z
    economics:
      benefits:
        - benefit_id: ben_01
          description: Up to HKD 100,000 in financial grant support through a six-month programme with three milestones (Silver, Gold, and Platinum Badges).
          duration:
            kind: exact
            value: P6M
          kind: other
          value:
            amount:
              currency: HKD
              minor_units: 10000000
            kind: up-to
        - benefit_id: ben_02
          description: Coaching from HKUST advisors, mentorship-network connections, entrepreneurship training, and preparation for HKSTP incubation admission.
          kind: other
      consideration:
        kind: unknown
        description: The official programme page does not specify a participation price or equity consideration.
    eligibility:
      rule:
        kind: all
        rules:
          - criterion_id: cri_01
            kind: manual
            reason: external-verification
            statement: The team must include at least one HKUST current student, alumnus, faculty member, or staff member, and HKUST members must hold at least 10% ownership in the proposed company.
          - criterion_id: cri_02
            kind: manual
            reason: external-verification
            statement: The proposal must be an innovative idea supported by research and development and business planning.
          - kind: any
            rules:
              - criterion_id: cri_03
                kind: manual
                reason: external-verification
                statement: Individual applicants must hold a Hong Kong Identity Card and be aged 18 or above.
              - criterion_id: cri_04
                kind: manual
                reason: external-verification
                statement: Company applicants must have a limited company incorporated in Hong Kong for less than two years by the application start date.
          - criterion_id: cri_05
            kind: manual
            reason: external-verification
            statement: Individual and team applicants must incorporate a Hong Kong limited company before submitting the second milestone assessment, and the main applicant must be a shareholder of the proposed company.
          - criterion_id: cri_06
            kind: manual
            reason: external-verification
            statement: Applicants and team members must not currently participate in, or hold shares in ventures participating in, pre-incubation or incubation programmes including HKSTP Ideation or Incubation and Cyberport CCMF, CUPP, or Incubation.
          - criterion_id: cri_07
            kind: manual
            reason: external-verification
            statement: Admission is subject to application assessment and selection; the grant is not guaranteed to applicants.
    roles:
      terms_authority_entity_id: ent_01m2hb2fz3czqn32kjt4t6dzfa
      access_operator_entity_id: ent_01m2hb2fz3czqn32kjt4t6dzfa
    access:
      availability: public
      method: form
      url: https://ust.az1.qualtrics.com/jfe/form/SV_3ZS6zJVl3Hpw5O6
      instructions: Apply via the online application with the programme application form, a 5–10-page pitch deck, a 3–5-minute pitch video, and BR, CI, AOA and NNC1 if applicable. Cohort UST27-10 closes on 20 September 2026; panel assessment is October–November, results are announced on 30 November 2026, and the programme starts on 1 February 2027.
