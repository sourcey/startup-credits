offers:
  - offer_id: off_01m4ztx5j09jevawrpny0g1q5a
    offer_slug: startup-programme
    offer_slug_aliases: []
    title: Mailazy Startup programme
    summary: Eligible young startups pay $172 for the first year of Mailazy Pro instead of the $490 yearly list price, a 65% discount, with every Pro feature included.
    lifecycle:
      status: active
      effective_from: 2026-10-15T13:09:49.805Z
    economics:
      consideration:
        kind: variable
        description: The qualified startup pays $172 for the first year of the yearly Pro plan instead of the $490 list price; after that year the account renews at the normal yearly Pro price unless the plan is changed.
      benefits:
        - benefit_id: ben_01
          applies_to: yearly Pro plan
          description: 65% off the yearly Pro plan for the first year ($172 instead of $490)
          kind: discount
          percentage:
            kind: exact
            basis_points: 6500
          duration:
            kind: exact
            value: P1Y
    eligibility:
      rule:
        kind: all
        rules:
          - criterion_id: cri_00
            fact: company.age_months
            kind: predicate
            operator: lt
            statement: Incorporated less than 12 months ago, counted from the certificate of incorporation date
            value:
              type: number
              value: 12
          - criterion_id: cri_01
            fact: company.funding_raised_usd
            kind: predicate
            operator: lt
            statement: Under $3M raised in total across all rounds, including pre-seed, SAFEs, notes and grants; bootstrapped companies qualify
            value:
              type: number
              value: 3000000
          - criterion_id: cri_02
            fact: company.employee_count
            kind: predicate
            operator: lt
            statement: Fewer than 25 people, full-time equivalents, founders included
            value:
              type: number
              value: 25
          - criterion_id: cri_03
            fact: company.is_current_customer
            kind: predicate
            operator: eq
            statement: New to paid Mailazy; the programme is for teams starting out, not a cheaper renewal for existing paid accounts
            value:
              type: boolean
              value: false
    roles:
      terms_authority_entity_id: ent_01m4ztx5hsewmnr945600gxevs
