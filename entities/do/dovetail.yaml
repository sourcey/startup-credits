    title: FDA Pathway & Pre-Submission Meeting Program
    summary: Three medical device startup founders per month receive free FDA pathway and Q-Sub preparation support tailored to their current submission stage, subject to application review.
    description: Support may cover review of an existing submission and FDA correspondence, refinement of a ready Q-Sub package and questions, or creation of a question framework for founders starting from scratch. These are stage-dependent options, not a fixed sequence.
