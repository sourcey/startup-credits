        criterion_id: cri_founder_application
        reason: external-verification
        statement: Medical device startup founders apply with their company, device and intended FDA pathway or current uncertainty. Dovetail reviews eligibility; applying does not guarantee a place. Capacity is three founders per month, with applications reviewed in arrival order and a waiting list when full. Applicants consent to contact about the application and storage of their details under the Privacy Policy.
