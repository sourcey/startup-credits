    title: Up to $10,000 in Ultralytics Platform credits for startups
    summary: Funded startups from Seed onward can receive up to $10,000 in Ultralytics Platform credits, which are not general-purpose cloud credits, plus first-year Enterprise Licensing savings.
    description: Credits are spent on eligible Ultralytics Platform services for organising datasets, training YOLO26 models, and preparing production deployments; they cannot be used as general-purpose cloud credits.
    lifecycle:
      status: active
      effective_from: 2026-11-08T17:35:00Z
    economics:
      benefits:
        - benefit_id: ben_platform_credits
          kind: credit
          description: Up to $10,000 in credits for eligible Ultralytics Platform services, limited to dataset organisation, model training, and production deployment preparation.
          value:
            kind: up-to
            amount:
              currency: USD
              minor_units: 1000000
        - benefit_id: ben_licensing_discount
          kind: discount
          description: First-year savings on an Ultralytics Enterprise License for private and commercial YOLO products; the page does not publish a fixed percentage.
          percentage:
            kind: up-to
            basis_points: 10000
        - benefit_id: ben_expert_guidance
          kind: other
          description: Guidance from Ultralytics computer vision experts on moving a use case from data to training, deployment, and scale.
      consideration:
        kind: none
