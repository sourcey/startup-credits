    title: PartnerStack for Startups pricing, 8-week bootcamp, and onboarding
    summary: Qualifying B2B SaaS startups with fewer than 50 employees, up to $5M in funding, and under 5 years old receive startup-friendly PartnerStack pricing, expert onboarding, and an 8-week partnerships bootcamp.
    description: Approved startup applicants receive tailored startup-friendly pricing to launch their first partner program, expert onboarding and setup, access to the 8-week PartnerStack for Startups Bootcamp, Slack community access, Customer Success Manager workshops and webinars, and office hours.
    lifecycle:
      status: active
      effective_from: 2026-10-23T04:33:00.000Z
    economics:
      benefits:
        - benefit_id: ben_01
          kind: other
          description: Startup-friendly pricing tailored for early-stage B2B SaaS startups launching their first partner program, plus expert onboarding and setup, 8-week PartnerStack for Startups Bootcamp, Slack community access, Customer Success Manager workshops and webinars, and strategy office hours.
      consideration:
        kind: variable
        description: Paid subscription at startup-friendly pricing arranged through a demo consultation; only a limited number of startups are accepted at a time.
    eligibility:
      rule:
        kind: all
        rules:
          - criterion_id: cri_01
            fact: company.employee_count
            kind: predicate
            operator: lt
            statement: B2B SaaS startup with fewer than 50 employees.
            value:
              type: number
              value: 50
          - criterion_id: cri_02
            fact: company.funding_raised_usd
            kind: predicate
            operator: lte
            statement: Up to $5M in total funding raised.
            value:
              type: number
              value: 5000000
          - criterion_id: cri_03
            fact: company.age_months
            kind: predicate
            operator: lt
            statement: Less than 5 years (60 months) old.
            value:
              type: number
              value: 60
          - criterion_id: cri_04
            kind: manual
            reason: not-machine-evaluable
            statement: Must be a B2B SaaS company, a new PartnerStack customer (previous or active customers do not qualify), and have no established partner program.
