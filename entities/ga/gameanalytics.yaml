    offer_slug: startup-pipelineiq-marketiq-discounts
    offer_slug_aliases: []
    title: Free and discounted PipelineIQ Pro and MarketIQ Pro for VC-backed studios
    summary: Approved studios backed by a GameAnalytics partner VC get PipelineIQ Pro free for 3 months, then 50% off for 12 months, plus 50% off an annual MarketIQ Pro subscription.
    lifecycle:
      status: active
      effective_from: 2026-10-06T15:33:10.000Z
    economics:
      benefits:
        - benefit_id: ben_01
          description: PipelineIQ Pro is free for the first 3 months for approved studios.
          kind: free-service
          service: PipelineIQ Pro
          duration:
            kind: exact
            value: P3M
        - benefit_id: ben_02
          description: 50% off the PipelineIQ Pro base price for the following 12 months, with usage above 2 million MAU billed at $1 per 1,000 MAU.
          kind: discount
          applies_to: PipelineIQ Pro
          duration:
            kind: exact
            value: P12M
          percentage:
            kind: exact
            basis_points: 5000
        - benefit_id: ben_03
          description: Save 50% on an annual MarketIQ Pro subscription; includes 10 seats for Ad Insights, the ad and creative intelligence platform, and Store Intelligence.
          kind: discount
          applies_to: MarketIQ Pro
          duration:
            kind: exact
            value: P1Y
          percentage:
            kind: exact
            basis_points: 5000
      consideration:
        kind: variable
        description: The startup receives 3 months of PipelineIQ Pro free, then 50% off the base price for 12 months, plus 50% off a 12-month MarketIQ Pro subscription.
    eligibility:
      rule:
        kind: all
        rules:
          - criterion_id: cri_partner_vc
            fact: company.partner_memberships
            kind: predicate
            operator: contains
            statement: The studio is backed by one of GameAnalytics's partner VCs.
            value:
              type: string
              value: vc_investor
          - criterion_id: cri_pre_series_b
            fact: company.funding_stage
            kind: predicate
            operator: in
            statement: The studio is pre-series B in funding.
            value:
              type: string-set
              values:
                - pre-seed
                - seed
                - Series A
          - criterion_id: cri_sdk_integrated
            kind: manual
            reason: external-verification
            statement: The studio is signed up to GameAnalytics with the SDK integrated.
