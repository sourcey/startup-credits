        kind: manual
        reason: not-machine-evaluable
        statement: >-
          Startup-tier applicants need a live model-powered product with real users and under
          $2 million raised. They must also meet all six general requirements: a software
          product that calls models rather than consulting or resale; a public site, repo, or
          demo; early-stage, pre-Series A status; at least $50 already spent on MiniRouter
          using their own account and application email; one application per company; and a
          short note about what they built when they ship.
