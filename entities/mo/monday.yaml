    title: Ten monday dev seats at $2 per seat per month for one year
    summary: Eligible startups receive ten monday dev seats with access to all features at $2 per seat per month for their first year, saving over $2,000 versus standard pricing.
    description: The benefit covers a one-year subscription for a 10-seat monday dev Pro plan at a one-off payment of $240 USD. The benefit is not transferable and does not apply to subsequent upgrades or renewals. monday.com reserves the right to discontinue the program at any time.
    lifecycle:
      status: active
      effective_from: '2026-10-22T00:00:00.000Z'
    economics:
      consideration:
        kind: unknown
        description: Eligible startups pay a one-off discounted subscription of $240 USD for ten seats for the first year.
      benefits:
        - benefit_id: ben_startup_discount
          description: Ten monday dev seats with access to all features at $2 per seat per month for the first year, saving over $2,000 versus standard pricing.
          kind: discount
    eligibility:
      rule:
        kind: all
        rules:
          - kind: predicate
            criterion_id: cri_company_age
            statement: The startup must have been founded within the last two years.
            fact: company.age_years
            operator: lt
            value:
              type: number
              value: 2
          - kind: manual
            criterion_id: cri_vc_backed
            statement: The startup must be backed by a venture capital firm, startup accelerator, or incubator.
            reason: external-verification
          - kind: manual
            criterion_id: cri_company_size
            statement: The startup must have up to 50 employees.
            reason: external-verification
          - kind: manual
            criterion_id: cri_no_paid_account
            statement: The startup must not hold a non-trial account for monday dev, monday CRM, monday services, or monday work management at the time of applying.
            reason: external-verification
          - kind: manual
            criterion_id: cri_vendor_approval
            statement: monday.com manually reviews each application and emails an access code to approved startups.
            reason: vendor-discretion
