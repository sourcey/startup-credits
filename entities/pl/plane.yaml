    summary: Plane for Startups gives eligible early-stage startups 6 months of Plane Pro free for up to 25 seats on Plane Cloud or self-hosted, worth up to $2,000 with AI credits included.
    source_ids:
      - src_a126310c71cec576164b7dd6329e6329e614537a687838b9b4013707f4860f60
offers:
  - offer_id: off_01m7y670hwgj5crjqxzvht89ap
    program_id: prg_01m7y670hvcfehjmez6v55envf
    offer_slug: plane-pro-six-months-free-startups
    offer_slug_aliases: []
    title: 6 months of Plane Pro free for up to 25 seats
    summary: Eligible early-stage startups founded 3 years ago or less with up to $1.5M raised receive 6 months of Plane Pro free for up to 25 seats (worth up to $2,000, AI credits included) on Plane Cloud or self-hosted.
    description: Provides 6 months of Plane Pro free from the day Pro is activated on a Plane Cloud workspace or self-hosted instance for up to 25 seats, worth up to $2,000 with AI credits included. Existing Free workspaces upgrade in place. Each startup can redeem the offer only once, and it cannot be applied to Enterprise Grid.
    lifecycle:
      status: active
      effective_from: 2026-11-21T04:35:42.000Z
    economics:
      benefits:
        - benefit_id: ben_01
          description: 6 months of Plane Pro free for up to 25 seats on Plane Cloud or self-hosted, worth up to $2,000 with AI credits included.
          duration:
            kind: exact
            value: P6M
          kind: free-service
          service: Plane Pro (up to 25 seats, Plane Cloud or self-hosted, AI credits included)
      consideration:
        kind: none
    eligibility:
      rule:
        kind: all
        rules:
          - criterion_id: cri_01
            fact: company.is_registered
            kind: predicate
            operator: eq
            statement: Company must be registered.
            value:
              type: boolean
              value: true
          - criterion_id: cri_02
            fact: company.is_subsidiary
            kind: predicate
            operator: eq
            statement: Company must be independent and not a subsidiary.
            value:
              type: boolean
              value: false
          - criterion_id: cri_03
            fact: company.funding_raised_usd
            kind: predicate
            operator: lte
            statement: Up to $1.5M raised (including bootstrapped startups).
            value:
              type: number
              value: 1500000
          - criterion_id: cri_04
            fact: company.age_years
            kind: predicate
            operator: lte
            statement: Founded 3 years ago or less.
            value:
              type: number
              value: 3
          - criterion_id: cri_05
            kind: manual
            reason: external-verification
            statement: Must be new to Plane or on the Free plan today; cannot be applied to Enterprise Grid.
          - criterion_id: cri_06
            kind: manual
            reason: not-machine-evaluable
            statement: Operates as a product company.
          - criterion_id: cri_07
            kind: manual
            reason: external-verification
            statement: Each startup can redeem the Plane for Startups offer only once.
