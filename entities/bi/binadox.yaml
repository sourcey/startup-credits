    title: Premium free for 12 months
    summary: Eligible independent startups receive 12 months of Binadox Premium free, with unlimited cloud accounts, SaaS applications and seats. Activation requires a payment card; Premium then renews at $499/month unless cancelled.
    description: The offer is limited to one per company and is non-transferable. There is no automatic extension. After the free year, the account continues on Binadox Premium at $499/month unless cancelled beforehand. Renewal reminders are sent 60, 30 and 7 days in advance.
