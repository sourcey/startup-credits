    offer_slug_aliases: []
    title: Up to €100,000 in enum cloud credits over 12 months
    summary: Selected EU-headquartered startups and scaleups ready for production workloads can receive up to €100,000 in enum cloud credits over 12 months, with an extension possible.
    lifecycle:
      status: active
      effective_from: 2026-09-02T00:00:00.000Z
    economics:
      benefits:
        - benefit_id: ben_01
          description: Up to €100,000 in cloud credits over 12 months on enum's platform, with an extension possible
          duration:
            kind: at-least
            value: P12M
          kind: credit
          value:
            amount:
              currency: EUR
              minor_units: 10000000
            kind: up-to
        - benefit_id: ben_02
          description: A highly available, production-ready Kubernetes cluster and full platform access to Kubernetes Engine, object storage, and networking
          kind: other
      consideration:
        kind: unknown
        description: The startup page does not establish separate consideration for the cloud credits.
    eligibility:
      rule:
        kind: all
        rules:
          - criterion_id: cri_01
            fact: company.headquarters_region
            kind: predicate
            operator: eq
            statement: Company is a European startup or scaleup headquartered in the EU.
            value:
              type: string
              value: EU
          - criterion_id: cri_02
            fact: company.product_cloud_fit
            kind: predicate
            operator: present
            statement: Company is building a product that belongs on European cloud infrastructure.
          - criterion_id: cri_03
            fact: company.production_readiness
            kind: predicate
            operator: eq
            statement: Company is ready to deploy production workloads, not just testing.
            value:
              type: boolean
              value: true
          - criterion_id: cri_04
            kind: manual
            reason: vendor-discretion
            statement: enum reviews every application and selects startups that align with its mission.
