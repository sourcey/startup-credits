offers:
  - offer_id: off_01m1s5494jwet73ydepj97f1d0
    program_id: prg_01m1s5494jkq3zv6ck8k77r3qg
    offer_slug: new-frontiers-phase-2-founder-support
    offer_slug_aliases: []
    title: New Frontiers Phase 2 founder support
    summary: Eligible founders in Ireland receive six months of startup support, including a EUR 17,500
      allowance subject to eligibility and satisfactory performance. No equity is taken.
    description: Register interest to contact a local Programme Manager; the national form is not an
      application. The institution provides the application when recruitment opens. Deadlines vary
      by location; consult the current calendar.
    lifecycle:
      status: active
      effective_from: 2026-09-05T16:06:21.070Z
    economics:
      consideration:
        kind: unknown
        description: No equity is taken. The cited pages do not specify a separate participation fee.
      benefits:
        - benefit_id: ben_allowance
          kind: other
          description: EUR 17,500 tax-free allowance for one founder during the six-month Phase 2 programme,
            subject to eligibility and satisfactory performance.
        - benefit_id: ben_coworking
          kind: free-service
          service: Co-working space during Phase 2
          description: Free co-working space during the six-month Phase 2 programme.
          duration:
            kind: exact
            value: P6M
        - benefit_id: ben_support
          kind: other
          description: One-to-one mentoring, workshops, milestone reviews, access to R&D expertise and
            Enterprise Ireland resources, and investment-readiness support.
    eligibility:
      rule:
        kind: all
        rules:
          - kind: manual
            criterion_id: cri_01
            statement: Early-stage founder over 18, based and legally able to live and run the business in the
              Republic of Ireland.
            reason: external-verification
          - kind: manual
            criterion_id: cri_02
            statement: Innovative business idea with export and employment potential; subject to the sector
              exclusions published in the eligibility criteria.
            reason: external-verification
          - kind: manual
            criterion_id: cri_03
            statement: Competitive Phase 2 selection, including an interview; full-time commitment for six
              months, campus attendance, and satisfactory milestone performance.
            reason: external-verification
          - kind: manual
            criterion_id: cri_04
            statement: Only one co-founder may participate and receive the allowance. Previous Phase 2 graduates
              are ineligible; Phase 1 is not a prerequisite.
            reason: external-verification
          - kind: manual
            criterion_id: cri_05
            statement: Disclose applicant and co-founder funding. Funding above EUR 100,000 excludes the
              allowance. Other public supports, prior feasibility funding, LEO grants, and
              co-founder funding can restrict eligibility; published funding-conflict rules apply.
            reason: external-verification
          - kind: manual
            criterion_id: cri_06
            statement: Accepting Enterprise Ireland PSSF ends the allowance. Applications and deadlines are
              managed by the selected local institution.
            reason: external-verification
