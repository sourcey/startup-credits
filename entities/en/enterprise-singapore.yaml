    offer_slug: startup-sg-founder
    offer_slug_aliases: []
    title: Startup SG Founder Grant
    summary: SGD 20,000–50,000 grant with 1:1 capital co-matching for eligible first-time Singaporean or permanent-resident founders.
    lifecycle:
      status: active
      effective_from: 2026-08-01T00:00:00.000Z
    economics:
      benefits:
        - benefit_id: ben_01
          description: SGD 20,000–50,000 grant
          kind: grant
          value:
            amount:
              currency: SGD
              minor_units: 2000000
            kind: range
            range:
              min:
                currency: SGD
                minor_units: 2000000
              max:
                currency: SGD
                minor_units: 5000000
        - benefit_id: ben_02
          description: 1:1 capital co-matching from third-party investors
          kind: match-funding
          value:
            ratio: "1:1"
            description: For every SGD 1 invested by third-party investors, the government matches SGD 1
      consideration:
        kind: none
    eligibility:
      rule:
        criterion_id: cri_01
        fact: founder.residency
        kind: predicate
        operator: eq
        statement: First-time Singaporean or permanent-resident founders
        value:
          type: string
          value: singapore-pr
      criteria:
        - criterion_id: cri_01
          fact: founder.experience
          kind: predicate
          operator: eq
          statement: Must be first-time founders
          value:
            type: string
            value: first-time
        - criterion_id: cri_02
          fact: founder.nationality
          kind: predicate
          operator: in
          statement: Must be Singaporean citizen or permanent resident
          value:
            type: array
            items:
              - Singapore Citizen
              - Permanent Resident
        - criterion_id: cri_03
          fact: company.location
          kind: predicate
          operator: eq
          statement: Must register and operate business in Singapore
          value:
            type: string
            value: SG
        - criterion_id: cri_04
          fact: company.age
          kind: predicate
          operator: eq
          statement: Entity must not be incorporated more than 6 months before application
          value:
            type: string
            value: less-than-6-months
