    offer_slug_aliases: []
    title: 90,000 Free Minutes and Dedicated Support through Vapi for Startups
    summary: Qualified early-stage voice AI startups receive 90,000 free usage minutes over 12 months, dedicated private Slack engineering support, and priority feature access.
    lifecycle:
      status: active
      effective_from: 2026-11-06T00:00:00.000Z
    economics:
      consideration:
        kind: none
      benefits:
        - benefit_id: ben_minutes
          kind: free-service
          service: Vapi Voice AI Platform Usage
          description: 90,000 free usage minutes allocated as 7,500 minutes per month for 12 months.
        - benefit_id: ben_support
          kind: free-service
          service: Dedicated technical support
          description: Direct access to a private Slack channel with the Vapi engineering team.
        - benefit_id: ben_features
          kind: free-service
          service: Priority feature access
          description: Early access to new voice AI tools and features before public release.
    eligibility:
      rule:
        kind: all
        rules:
          - criterion_id: cri_voice_focus
            kind: manual
            reason: external-verification
            statement: Applicant is a startup building voice AI products or features with plans to launch within 6 months.
          - criterion_id: cri_funding_stage
            kind: manual
            reason: external-verification
            statement: Pre-seed to Series A company with $250k or more in total funding.
          - criterion_id: cri_approval
            kind: manual
            reason: external-verification
            statement: Applications are subject to review and selection by the Vapi team.
