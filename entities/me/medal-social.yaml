    title: Medal Social Startup Business Plan
    summary: Approved pre-seed and seed teams receive the Business plan free for up to 12 months, ending sooner at $1M ARR or 18 months from incorporation.
    description: >-
      The startup period requires no card or payment details. The page advertises
      12 months free and states that access lasts until $1M ARR or 18 months from
      incorporation, whichever comes first. Its FAQ states that after 12 months
      the workspace rolls onto the paid Business plan at $249 per month with
      annual billing or $311.25 per month with monthly billing, with 30 days'
      notice and cancellation available at any time.
