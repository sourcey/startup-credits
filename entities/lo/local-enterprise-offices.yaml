offers:
  - offer_id: off_01m2h4d9bcyn3q4nc2n1yq49k1
    offer_slug: priming-grant
    offer_slug_aliases: []
    title: Priming Grant
    summary: Eligible Irish microenterprises in their first 18 months can apply for a grant covering up to 50% of
      investment, normally capped at EUR 80,000, with an exceptional EUR 150,000 ceiling.
    description: Eligible expenditure includes capital, salaries, consultancy, innovation, marketing and
      overheads. Grants of EUR 50,000 or more, or EUR 100,000 cumulatively over three years, require
      Enterprise Ireland approval.
    lifecycle:
      status: active
      effective_from: 2026-09-14T23:35:33.996Z
    economics:
      benefits:
        - benefit_id: ben_priming_grant
          kind: other
          description: Startup grant capped at the lower of 50% of investment and EUR 80,000. Exceptional projects
            showing potential to graduate to Enterprise Ireland can receive up to EUR 150,000, still within
            50%. Employment support is capped at EUR 15,000 per full-time job created, within the overall
            limits.
      consideration:
        kind: variable
        description: "The applicant must fund the investment not covered by the grant: at least 50%, and more when the
          applicable monetary cap binds."
    eligibility:
      rule:
        kind: all
        rules:
          - kind: manual
            criterion_id: cri_early_local_business
            reason: external-verification
            statement: Sole traders, partnerships or limited companies must be within their first 18 months, established,
              registered and operating in the relevant Local Enterprise Office area, with a demonstrated
              commercial market, growth potential and potential new jobs.
          - kind: manual
            criterion_id: cri_size
            reason: external-verification
            statement: Normally at most 10 employees; larger enterprises may qualify under specific criteria through a
              local advisor. Partner and linked enterprises must be included when assessing size and financial
              thresholds.
          - kind: manual
            criterion_id: cri_sectors
            reason: external-verification
            statement: Priority goes to manufacturing and internationally traded services with export potential. Unique
              tourism services targeting overseas visitors may receive salary support where local displacement
              and deadweight are avoided.
          - kind: manual
            criterion_id: cri_exclusions
            reason: external-verification
            statement: Enterprise Ireland, IDA and Udaras na Gaeltachta clients are excluded, as are domestically focused
              retail, personal, professional and construction services; coal, steel, gambling, adult
              entertainment, tobacco and unauthorised cannabis products are also ineligible.
          - kind: manual
            criterion_id: cri_application
            reason: external-verification
            statement: Submit an application before committing to, ordering, purchasing, contracting for or starting any
              project expenditure or activity. Local assessment must establish commercial viability and avoid
              unacceptable deadweight, displacement and ineligible activities.
