programs:
  - program_id: prg_01kyypqp9x1dsvsdfvwa51pt63
    program_slug: imagekit-startup-program
    program_slug_aliases: []
    title: ImageKit Startup Program
    summary: ImageKit Startup Program offers usage-based discounted pricing and media management tools to eligible VC-, incubator-, and accelerator-backed startups.
    source_ids:
      - src_cecce3421b2866fa66624dbeb4abce438ce0a05bf59d1b7058f967f84d795e24
offers:
  - offer_id: off_01kyypqp9x66145g8gkwd47xh2
    program_id: prg_01kyypqp9x1dsvsdfvwa51pt63
    offer_slug: imagekit-startup-program
    offer_slug_aliases: []
    title: ImageKit Startup Program
    summary: Eligible early-stage startups backed by recognized accelerators, incubators, or VCs get discounted usage-based pricing on media delivery bandwidth, DAM storage, processing units, custom domains, and extra users with no monthly fixed costs.
    lifecycle:
      status: active
      effective_from: 2026-08-01T12:56:03.394Z
    economics:
      benefits:
        - benefit_id: ben_01
          description: "Exclusive startup discounts on all billing components: Media delivery bandwidth at $0.10 per GB, Digital Asset Management storage at $8 per 100GB, Video Processing Units at $8 per 10K units, Extension Units at $8 per 5K units, Custom Domain Name at $8 per domain/month, and 3 users included with additional users at $8 each."
          kind: other
      consideration:
        kind: variable
        description: Completely usage-based pricing - no monthly fixed costs.
    eligibility:
      rule:
        kind: all
        rules:
          - criterion_id: cri_01
            fact: company.age_months
            kind: predicate
            operator: lt
            statement: Startups that are less than 4 years old.
            value:
              type: number
              value: 48
          - criterion_id: cri_01_rely
            kind: manual
            reason: vendor-discretion
            statement: Must rely heavily on images or videos.
          - criterion_id: cri_02
            kind: manual
            statement: Must be associated with an accelerator, incubator, or VC firm on ImageKit's partner list. Proof, such as a public announcement, a verification email, or a partner letter, would be required to establish this.
            reason: external-verification
          - kind: any
            rules:
              - kind: predicate
                criterion_id: cri_03_funding
                statement: Must have raised up to $20 million in funding.
                fact: company.funding_raised_usd
                operator: lte
                value:
                  type: number
                  value: 20000000
              - kind: manual
                criterion_id: cri_03_stage
                statement: Must have raised up to a series B round.
                reason: external-verification
          - criterion_id: cri_04
            kind: manual
            statement: Must have a working company website or app.
            reason: external-verification
          - criterion_id: cri_05
            kind: predicate
            statement: Must not be an existing paid customer of ImageKit.
            fact: company.is_current_customer
            operator: eq
            value:
              type: boolean
              value: false
          - criterion_id: cri_06
            kind: manual
            reason: external-verification
            statement: Must not have received previous ImageKit credits.
          - kind: manual
            criterion_id: cri_07
            statement: Must sign up using a business email.
            reason: external-verification
    roles:
      terms_authority_entity_id: ent_01kyypqp9xhfg48ahr7mzen3ks
      access_operator_entity_id: ent_01kyypqp9xhfg48ahr7mzen3ks
    access:
      availability: membership
      method: form
