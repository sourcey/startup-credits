profile:
  summary: Vectorize builds Hindsight, an agent memory layer that lets AI agents remember users across sessions and learn over time, available open source or as Hindsight Cloud.
  description: Vectorize builds Hindsight, an open-source and fully managed memory platform for AI agents, with per-user memory, cross-session persistence, and fast recall.
