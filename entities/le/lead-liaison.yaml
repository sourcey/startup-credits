    title: Lead Liaison for Startups Seed-Stage discount
    summary: Seed-stage startups with under USD 2 million in total funding from an approved incubator, accelerator or VC get 90% off Lead Liaison subscription licenses for 24 months, then 50% off for 12 months.
    lifecycle:
      status: active
      effective_from: 2026-09-06T05:26:15.069Z
    economics:
      consideration:
        kind: variable
        description: The startup pays list price less 90% for 24 months, then less 50% for the next 12 months, on any subscription license; Professional Services are not discounted.
      benefits:
        - benefit_id: ben_01m1tjwy8yr4xkr9afsggprpps
          kind: discount
          applies_to: Any subscription license
          description: 90% discount off list price for 24 months.
          percentage:
            kind: exact
            basis_points: 9000
          duration:
            kind: exact
            value: P24M
        - benefit_id: ben_01m1tjwy8y1kr9zvacnckz1wjm
          kind: discount
          applies_to: Any subscription license
          description: 50% discount for the next 12 months; this later discount requires a graduate certificate from Lead Liaison's Sales & Marketing University.
          percentage:
            kind: exact
            basis_points: 5000
          duration:
            kind: exact
            value: P12M
    eligibility:
      rule:
        kind: all
        rules:
          - criterion_id: cri_seed_stage_qualification
            kind: predicate
            fact: company.funding_raised_usd
            operator: lt
            value:
              type: number
              value: 2000000
            statement: The startup has less than USD 2 million in total funding.
          - criterion_id: cri_seed_stage_new_customer
