    eligibility:
      rule:
        kind: all
        rules:
          - criterion_id: cri_01
            kind: manual
            statement: Applicant has an innovative technical solution that helps customers with digital transformation and has a functioning minimum viable product.
            reason: vendor-discretion
          - criterion_id: cri_02
            fact: company.age_months
            kind: predicate
            operator: lt
            statement: Applicant was established less than three years ago.
            value:
              type: number
              value: 36
          - criterion_id: cri_03
            fact: company.annual_revenue_usd
            kind: predicate
            operator: lt
            statement: Applicant's total annual revenue is less than $500,000.
            value:
              type: number
              value: 500000
          - criterion_id: cri_04
            kind: manual
            statement: Applicant has less than $1 million in capital.
            reason: external-verification
          - criterion_id: cri_05
            fact: company.is_private
            kind: predicate
            operator: eq
            statement: Applicant is a private company.
            value:
              type: boolean
              value: true
          - criterion_id: cri_06
            kind: manual
            statement: Applicant develops a company-owned software product, or provides services based on that product, as the core of its existing or planned business.
            reason: external-verification
          - criterion_id: cri_07
            kind: manual
            statement: Applicant does not have an active contract with Cloud4Y or another cloud operator.
            reason: external-verification
          - criterion_id: cri_08
            kind: manual
            statement: Applicant has a website on a company-owned domain, and the contact email uses the same domain.
            reason: external-verification
          - criterion_id: cri_09
            kind: manual
            statement: A recipient must place the Cloud4Y logo and a link to Cloud4Y on the homepage of its website.
            reason: external-verification
