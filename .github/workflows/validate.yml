name: validate-catalog-change

on:
  pull_request_target:

permissions:
  checks: write
  contents: read
  statuses: write

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate catalog change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The trusted checkout exists only to read the current Catalog Verifier
      # pin, so it tracks the default branch rather than the pull request's
      # base commit: a pull request opened before the pin existed would
      # otherwise fail on a missing file instead of being validated.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Fetch the exact candidate SHA as inert data
        env:
          CANDIDATE_ORIGIN: ${{ github.event.pull_request.head.repo.clone_url }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          git init candidate
          git -C candidate remote add origin "$CANDIDATE_ORIGIN"
          git -C candidate fetch --filter=blob:none --no-tags origin "$HEAD_REVISION"
          git -C candidate checkout --detach "$HEAD_REVISION"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
      - name: Fetch the exact trusted comparison base
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        working-directory: candidate
        run: git fetch --filter=blob:none --no-tags https://github.com/sourcey/startup-credits.git "$BASE_REVISION"
      - name: Install the exact Sourcey Catalog Verifier
        run: |
          npm ci --prefix trusted/.github/catalog-verifier \
            --ignore-scripts --no-audit --no-fund
          requested_version="$(
            jq -er '.dependencies["@sourcey/catalog-verifier"]' \
              trusted/.github/catalog-verifier/package.json
          )"
          installed_version="$(
            jq -er '.version' \
              trusted/.github/catalog-verifier/node_modules/@sourcey/catalog-verifier/package.json
          )"
          test "$installed_version" = "$requested_version"
          verifier_digest="$(<trusted/.github/sourcey-catalog-verifier.sha256)"
          [[ "$verifier_digest" =~ ^[a-f0-9]{64}$ ]]
          verifier_url="$(
            jq -er '.packages["node_modules/@sourcey/catalog-verifier"].resolved' \
              trusted/.github/catalog-verifier/package-lock.json
          )"
          curl --fail-with-body --silent --show-error --max-time 30 \
            "$verifier_url" --output "$RUNNER_TEMP/sourcey-catalog-verifier.tgz"
          test "$(sha256sum "$RUNNER_TEMP/sourcey-catalog-verifier.tgz" | awk '{print $1}')" = \
            "$verifier_digest"
      - name: Issue the exact bounded Catalog identity context
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          verifier="trusted/.github/catalog-verifier/node_modules/.bin/sourcey-catalog-verify"
          taxonomy="trusted/.github/catalog-verifier/node_modules/@sourcey/catalog-verifier/taxonomy.json"
          curl --fail-with-body --silent --show-error --max-time 30 \
            https://api.sourcey.com/v1/release \
            --output "$RUNNER_TEMP/sourcey-live-release.json"
          live_parent_release_id="$(
            jq -er '.release_id | select(test("^sha256:[a-f0-9]{64}$"))' \
              "$RUNNER_TEMP/sourcey-live-release.json"
          )"
          live_root_digest="$(
            jq -er '.descriptor.snapshot_core.root_set_digest
              | select(test("^sha256:[a-f0-9]{64}$"))' \
              "$RUNNER_TEMP/sourcey-live-release.json"
          )"
          trusted_root_digest="$(<trusted/.github/sourcey-root-set.digest)"
          test "$live_root_digest" = "$trusted_root_digest"
          "$verifier" identity-context-request startup-credits \
            --repository "$GITHUB_WORKSPACE/candidate" \
            --base "$BASE_REVISION" \
            --head "$HEAD_REVISION" \
            --taxonomy "$taxonomy" \
            --live-parent-release-id "$live_parent_release_id" \
            --candidate-repository "$GITHUB_REPOSITORY" \
            --pull-request "$PULL_REQUEST_NUMBER" \
            > "$RUNNER_TEMP/sourcey-identity-query.json"
          curl --fail-with-body --silent --show-error --max-time 30 \
            -H 'content-type: application/json' \
            --data-binary @"$RUNNER_TEMP/sourcey-identity-query.json" \
            https://api.sourcey.com/v1/catalog-verifier/identity-contexts \
            --output "$RUNNER_TEMP/sourcey-identity-response.json"
          jq -e \
            --arg release_id "$live_parent_release_id" \
            '.release_id == $release_id
             and .data.query.liveParentReleaseId == $release_id' \
            "$RUNNER_TEMP/sourcey-identity-response.json" >/dev/null
          jq -e '.data' "$RUNNER_TEMP/sourcey-identity-response.json" \
            > "$RUNNER_TEMP/sourcey-identity-context.json"
          identity_context_digest="$(
            jq -er '.data.context.context_digest
              | select(test("^sha256:[a-f0-9]{64}$"))' \
              "$RUNNER_TEMP/sourcey-identity-response.json"
          )"
          echo "SOURCEY_IDENTITY_CONTEXT_DIGEST=${identity_context_digest#sha256:}" \
            >> "$GITHUB_ENV"
      - name: Validate only the changed identity closure
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          verified_at="$(node -p 'new Date().toISOString()')"
          trusted_root_digest="$(<trusted/.github/sourcey-root-set.digest)"
          trusted/.github/catalog-verifier/node_modules/.bin/sourcey-catalog-verify \
            validate startup-credits \
            --repository "$GITHUB_WORKSPACE/candidate" \
            --base "$BASE_REVISION" \
            --head "$HEAD_REVISION" \
            --taxonomy "trusted/.github/catalog-verifier/node_modules/@sourcey/catalog-verifier/taxonomy.json" \
            --identity-context "$RUNNER_TEMP/sourcey-identity-context.json" \
            --root-set trusted/.github/sourcey-root-set.json \
            --trusted-root-digest "$trusted_root_digest" \
            --verified-at "$verified_at" \
            --candidate-repository "$GITHUB_REPOSITORY" \
            --pull-request "$PULL_REQUEST_NUMBER" \
            --format json \
            | tee "$RUNNER_TEMP/sourcey-validation-result.json"
      - name: Verify Developer Certificate of Origin sign-off
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
        working-directory: candidate
        run: |
          change_base="$(git merge-base "$BASE_REVISION" "$HEAD_REVISION")"
          missing=()
          while IFS= read -r commit; do
            if ! git show -s --format=%B "$commit" \
              | grep -Eq '^Signed-off-by: .+ <[^>]+>$'; then
              missing+=("$commit")
            fi
          done < <(git rev-list --no-merges "$change_base..$HEAD_REVISION")
          if (( ${#missing[@]} > 0 )); then
            printf 'Commits missing Signed-off-by certification:\n%s\n' "${missing[*]}" >&2
            exit 1
          fi
      - name: Publish the App-bound validation result for the exact candidate head
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          VALIDATION_CONCLUSION: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          verifier_digest="$(<trusted/.github/sourcey-catalog-verifier.sha256)"
          [[ "$verifier_digest" =~ ^[a-f0-9]{64}$ ]]
          identity_context_digest="${SOURCEY_IDENTITY_CONTEXT_DIGEST:-$(printf '%064d' 0)}"
          [[ "$identity_context_digest" =~ ^[a-f0-9]{64}$ ]]
          external_id="sourcey-validation-v1:${BASE_REVISION}:${HEAD_REVISION}:${verifier_digest}:${identity_context_digest}"
          checks="$RUNNER_TEMP/sourcey-validation-checks.json"
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/commits/${HEAD_REVISION}/check-runs" \
            -f filter=latest -F per_page=100 > "$checks"
          mapfile -t existing_ids < <(
            jq -er --arg external_id "$external_id" \
              '.check_runs[]
               | select(.name == "sourcey/validation"
                   and .app.slug == "github-actions"
                   and .external_id == $external_id)
               | .id' "$checks"
          )
          if [[ "${#existing_ids[@]}" -gt 1 ]]; then
            echo "Duplicate exact Sourcey validation checks exist." >&2
            exit 1
          fi
          body="$RUNNER_TEMP/sourcey-validation-check.json"
          jq -n \
            --arg name sourcey/validation \
            --arg head_sha "$HEAD_REVISION" \
            --arg status completed \
            --arg conclusion "$VALIDATION_CONCLUSION" \
            --arg external_id "$external_id" \
            --arg title "Sourcey Catalog validation $VALIDATION_CONCLUSION" \
            --arg summary "Trusted changed-closure, signed identity-context, and DCO validation for the exact candidate head." \
            '{name: $name, head_sha: $head_sha, status: $status,
              conclusion: $conclusion, external_id: $external_id,
              output: {title: $title, summary: $summary}}' > "$body"
          if [[ "${#existing_ids[@]}" -eq 1 ]]; then
            jq 'del(.head_sha)' "$body" > "$body.patch"
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/check-runs/${existing_ids[0]}" \
              --input "$body.patch" > "$RUNNER_TEMP/sourcey-validation-written.json"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
              --input "$body" > "$RUNNER_TEMP/sourcey-validation-written.json"
          fi
          check_id="$(jq -er '.id' "$RUNNER_TEMP/sourcey-validation-written.json")"
          gh api "repos/${GITHUB_REPOSITORY}/check-runs/${check_id}" \
            > "$RUNNER_TEMP/sourcey-validation-readback.json"
          jq -e \
            --arg head_sha "$HEAD_REVISION" \
            --arg conclusion "$VALIDATION_CONCLUSION" \
            --arg external_id "$external_id" \
            --arg details_url "https://github.com/${GITHUB_REPOSITORY}/runs/${check_id}" \
            '.name == "sourcey/validation"
             and .head_sha == $head_sha
             and .status == "completed"
             and .conclusion == $conclusion
             and .external_id == $external_id
             and .details_url == $details_url
             and .html_url == $details_url
             and .app.slug == "github-actions"' \
            "$RUNNER_TEMP/sourcey-validation-readback.json" >/dev/null
      - name: Publish the exact Sourcey validation result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
          VALIDATION_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          VALIDATION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_REVISION}" \
            -f state="$VALIDATION_STATE" \
            -f context=sourcey/validation \
            -f description="Sourcey changed-closure validation ${VALIDATION_STATE}" \
            -f target_url="$VALIDATION_URL"
