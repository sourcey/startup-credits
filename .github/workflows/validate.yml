# Written by Sourcey's release chain with each Catalog Verifier pin.
name: validate

on:
  pull_request_target:

permissions:
  checks: write
  contents: read
  statuses: write

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    uses: sourcey/catalog-verifier/.github/workflows/validate.yml@ea886297169a0323ee452bb7d3af76ff3f974b73
