# Written by Sourcey's release chain with each Catalog Verifier pin.
name: validate

on:
  pull_request_target:

permissions:
  checks: write
  contents: read
  statuses: write

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    uses: sourcey/catalog-verifier/.github/workflows/validate.yml@95444ce21c67c76d1ee0ce0780d4e1f71e263e65
