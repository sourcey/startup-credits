# Written by Sourcey's release chain with each Catalog Verifier pin.
name: validate

on:
  pull_request_target:

permissions:
  checks: write
  contents: read
  statuses: write

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    uses: sourcey/catalog-verifier/.github/workflows/validate.yml@ca48a74e06f5b3bc45cc8a81d9c7ff750f8fe935
