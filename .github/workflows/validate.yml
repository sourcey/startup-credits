name: validate-catalog-change

on:
  pull_request_target:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Fetch the exact candidate SHA as inert data
        env:
          CANDIDATE_ORIGIN: ${{ github.event.pull_request.head.repo.clone_url }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          git init candidate
          git -C candidate remote add origin "$CANDIDATE_ORIGIN"
          git -C candidate fetch --no-tags --depth=1 origin "$HEAD_REVISION"
          git -C candidate checkout --detach "$HEAD_REVISION"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
      - name: Fetch the exact trusted comparison base
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        working-directory: candidate
        run: git fetch --no-tags --depth=1 https://github.com/sourcey/startup-credits.git "$BASE_REVISION"
      - name: Enforce the changed-path repository boundary
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
        working-directory: candidate
        run: |
          invalid=()
          while IFS= read -r -d '' path; do
            if [[ ! "$path" =~ ^(AGENTS\.md|CONTRIBUTING\.md|DATA-LICENSE\.md|LICENSE|README\.md|vendors/[a-z0-9][a-z0-9-]?/[a-z0-9][a-z0-9-]*\.yaml|\.github/CODEOWNERS|\.github/pull_request_template\.md|\.github/sourcey-candidate-verifier\.sha256|\.github/workflows/validate\.yml)$ ]]; then
              invalid+=("$path")
            fi
          done < <(git diff --name-only -z --no-renames "$BASE_REVISION" "$HEAD_REVISION")
          if (( ${#invalid[@]} > 0 )); then
            printf 'startup-credits contains forbidden changed paths:\n%s\n' "${invalid[@]}" >&2
            exit 1
          fi
      - name: Install the exact Sourcey Candidate Verifier
        run: |
          digest="$(<trusted/.github/sourcey-candidate-verifier.sha256)"
          if [[ ! "$digest" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Candidate Verifier pin must be one exact SHA-256 digest." >&2
            exit 1
          fi
          name="sourcey-candidate-verifier-sha256-${digest}.tar.gz"
          origin="https://artifacts.sourcey.com/catalog/code/candidate-verifier/sha256-${digest}"
          curl --fail-with-body --silent --show-error --max-time 120 \
            --output "$RUNNER_TEMP/$name" "$origin/$name"
          curl --fail-with-body --silent --show-error --max-time 120 \
            --output "$RUNNER_TEMP/$name.sha256" "$origin/$name.sha256"
          (
            cd "$RUNNER_TEMP"
            sha256sum --check "$name.sha256"
          )
          mkdir "$RUNNER_TEMP/candidate-verifier"
          tar -xzf "$RUNNER_TEMP/$name" \
            --strip-components=1 \
            -C "$RUNNER_TEMP/candidate-verifier"
      - name: Validate only the changed identity closure
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          node "$RUNNER_TEMP/candidate-verifier/sourcey-candidate-verifier.js" \
            validate-change \
            --repository "$GITHUB_WORKSPACE/candidate" \
            --base "$BASE_REVISION" \
            --head "$HEAD_REVISION"
      - name: Verify Developer Certificate of Origin sign-off
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
        working-directory: candidate
        run: |
          missing=()
          while IFS= read -r commit; do
            if ! git show -s --format=%B "$commit" \
              | grep -Eq '^Signed-off-by: .+ <[^>]+>$'; then
              missing+=("$commit")
            fi
          done < <(git rev-list "$BASE_REVISION..$HEAD_REVISION")
          if (( ${#missing[@]} > 0 )); then
            printf 'Commits missing Signed-off-by certification:\n%s\n' "${missing[*]}" >&2
            exit 1
          fi
