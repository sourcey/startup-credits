# Written by Sourcey's release chain with each Catalog Verifier pin.
name: validate

on:
  pull_request_target:

permissions:
  checks: write
  contents: read
  statuses: write

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    uses: sourcey/catalog-verifier/.github/workflows/validate.yml@5d49aed797b8f7a6930167bf1462619034ccb164
