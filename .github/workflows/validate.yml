# Written by Sourcey's release chain with each Catalog Verifier pin.
name: validate

on:
  pull_request_target:

permissions:
  checks: write
  contents: read
  statuses: write

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    uses: sourcey/catalog-verifier/.github/workflows/validate.yml@7f246acc6b8c6a68c456b98df4d96deab2a338bc
